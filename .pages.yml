# Pages CMS 配置：https://pagescms.org
# 这个文件决定后台里能编辑什么。改坏了后台会读不到内容，改动前先记下原样。

# 上传文件的存放位置。images 存图片，audio 存背景音乐。
media:
  - name: images
    label: 图片
    input: public/images
    output: /images
    categories: [image]
  - name: audio
    label: 音频
    input: public/audio
    output: /audio
    categories: [audio]

content:
  # ---------- 站点设置 ----------
  - name: settings
    label: 站点设置 · 背景音乐
    type: file
    path: src/content/settings/settings.md
    format: yaml-frontmatter
    fields:
      - name: bgm
        label: 背景音乐
        type: file
        options:
          media: audio
          categories: [audio]
          rename: safe
        description: 选一个 mp3 上传。留空则右上角不显示喇叭按钮。请使用你有权使用的音乐。
      - name: bgmVolume
        label: 音量（0-100）
        type: number
        description: 建议 25-40，背景音乐不该盖过人声。

  # ---------- 作品 ----------
  - name: works
    label: 作品
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: summary
        label: 一句话说明
        type: text
        required: true
        description: 说清解决了什么问题、做成了什么。
      - name: year
        label: 年份
        type: string
        required: true
        description: 写成 2024 或 2024.06（加引号更稳）。
      - name: role
        label: 你的角色
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面图
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图说明
        type: string
        description: 给看不见图的人一句话描述，也利于搜索。
      - name: video
        label: 视频嵌入地址
        type: string
        description: B 站格式：//player.bilibili.com/player.html?bvid=BV号&page=1&high_quality=1
      - name: docs
        label: 说明文档
        type: object
        list: true
        fields:
          - name: label
            label: 文档名称
            type: string
          - name: href
            label: 文件路径
            type: string
            description: PDF 放进 public/docs/ 后，这里填 /docs/文件名.pdf
      - name: order
        label: 排序
        type: number
        description: 数字越大越靠前。
      - name: draft
        label: 隐藏这个作品
        type: boolean
      - name: body
        label: 正文
        type: rich-text
        description: 建议按「背景 → 我做了什么 → 结果 → 一点反思」写。

  # ---------- AI 功能 ----------
  - name: ai
    label: 作品 · AI 功能
    type: collection
    path: src/content/ai
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: 项目名
        type: string
        required: true
      - name: en
        label: 英文名
        type: string
        description: 卡片右下角的小字，全大写更好看。
      - name: summary
        label: 一句话说明
        type: text
        required: true
        description: 列表和详情页顶部都会用。别超过 40 字。
      - name: year
        label: 年份
        type: string
        description: 写成 2026 或 2026.03。
      - name: state
        label: 状态
        type: select
        options:
          values: [自用中, 已上线, 实验中, 搁置]
      - name: stack
        label: 用到的技术
        type: string
        list: true
      - name: private
        label: 代码不公开
        type: boolean
        description: 打开后在详情页顶部挂一条「仅展示，不提供源码」的提示。
      - name: video
        label: 视频嵌入地址
        type: string
        description: B 站格式：//player.bilibili.com/player.html?bvid=BV号&page=1&high_quality=1。留空则不显示。
      - name: shots
        label: 截图
        type: object
        list: true
        fields:
          - name: src
            label: 图片
            type: image
            options:
              media: images
              path: public/images/ai
            description: 用 node scripts/img.mjs 处理过再放进来，别直接塞原图。
          - name: alt
            label: 说明
            type: string
          - name: blur
            label: 隐私打码
            type: boolean
            description: 打开后默认盖住，点一下才显示。
      - name: order
        label: 排序
        type: number
        description: 数字越大越靠前。
      - name: draft
        label: 隐藏
        type: boolean
      - name: body
        label: 正文
        type: rich-text
        description: 按「介绍 / 设计目的 / 怎么做的 / 踩了什么坑」四节写，用小标题分隔。

  # ---------- 关于页自述 ----------
  - name: about
    label: 关于页 · 自述
    type: file
    path: src/content/about/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: 自述正文
        type: rich-text
