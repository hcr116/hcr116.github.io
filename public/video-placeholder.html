<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频占位</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #24242a 0%, #111114 70%);
        color: #eceae6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        text-align: center;
        padding: 6%;
      }
      .play {
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        border-radius: 50%;
        border: 1px solid rgba(232, 201, 174, 0.5);
        background: rgba(200, 146, 106, 0.14);
        display: grid;
        place-items: center;
      }
      .play svg {
        display: block;
        margin-left: 4px;
      }
      h1 {
        font-size: clamp(15px, 2.4vw, 20px);
        font-weight: 500;
        letter-spacing: 0.02em;
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        font-size: clamp(11px, 1.5vw, 13.5px);
        line-height: 1.8;
        color: #a8a6a1;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        color: #e8c9ae;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        padding: 0.1em 0.36em;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="play" aria-hidden="true">
        <svg width="24" height="26" viewBox="0 0 24 26" fill="none">
          <path d="M2 2.5 22 13 2 23.5V2.5Z" fill="#e8c9ae" fill-opacity="0.92" />
        </svg>
      </div>
      <h1>这里将来是你的演示视频</h1>
      <p>
        把作品 Markdown 文件里的 <code>video</code> 换成 B 站或 YouTube 的嵌入地址，<br />
        这个占位块就会被真实播放器替换。
      </p>
    </div>
  </body>
</html>
