# Pages CMS 配置：https://pagescms.org
# 这个文件决定后台里能编辑什么。改坏了后台会读不到内容，改动前先记下原样。

# 上传文件的存放位置。images 存图片，audio 存背景音乐。
media:
  - name: images
    label: 图片
    input: public/images
    output: /images
    categories: [image]
  - name: audio
    label: 音频
    input: public/audio
    output: /audio
    categories: [audio]

content:
  # ---------- 首页 ----------
  - name: home
    label: 首页 · 文案
    type: file
    path: src/content/home/home.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: 大标题
        type: string
        required: true
        description: 首屏最大那行字。
      - name: subtitle
        label: 副标题
        type: string
        description: 显示在大标题下面，字号小一档。比如「战斗策划」。
      - name: intro
        label: 自我介绍
        type: text
        description: 副标题下面这段。两三句话说明你是谁、在做什么。

  # ---------- 站点设置 ----------
  - name: settings
    label: 站点设置 · 背景音乐
    type: file
    path: src/content/settings/settings.md
    format: yaml-frontmatter
    fields:
      - name: bgm
        label: 背景音乐
        type: file
        options:
          media: audio
          categories: [audio]
          rename: safe
        description: 选一个 mp3 上传。留空则右上角不显示喇叭按钮。请使用你有权使用的音乐。
      - name: bgmVolume
        label: 音量（0-100）
        type: number
        description: 建议 25-40，背景音乐不该盖过人声。

  # ---------- 时间线 ----------
  - name: timeline
    label: 时间线
    type: collection
    path: src/content/timeline
    format: yaml-frontmatter
    view:
      primary: year
    fields:
      - name: year
        label: 时间标签
        type: string
        required: true
        description: 写「至今」或「2025」这样的年份。至今永远排最上面，其余按年份从大到小自动排序。
      - name: title
        label: 小标题
        type: string
        description: 可以留空。
      - name: image
        label: 配图
        type: image
        options:
          media: images
          path: public/images/timeline
        description: 建议 16:10、宽 1600px 以内。不填则显示虚线占位框。
      - name: imageAlt
        label: 配图说明
        type: string
        description: 显示在图下方，同时作为图片的替代文字。
      - name: imageAspect
        label: 图框比例
        type: string
        description: 照图片实际比例填，避免被裁切。例如 16 / 10、4 / 3、1 / 1。留空默认 16 / 10。
      - name: draft
        label: 隐藏这一条
        type: boolean
      - name: body
        label: 正文
        type: rich-text
        description: 备注、工作履历、感悟都可以写在这里。图片可以直接拖进来。

  # ---------- 作品 ----------
  - name: works
    label: 作品
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: summary
        label: 一句话说明
        type: text
        required: true
        description: 说清解决了什么问题、做成了什么。
      - name: year
        label: 年份
        type: string
        required: true
        description: 写成 2024 或 2024.06（加引号更稳）。
      - name: role
        label: 你的角色
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面图
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图说明
        type: string
        description: 给看不见图的人一句话描述，也利于搜索。
      - name: video
        label: 视频嵌入地址
        type: string
        description: B 站格式：//player.bilibili.com/player.html?bvid=BV号&page=1&high_quality=1
      - name: docs
        label: 说明文档
        type: object
        list: true
        fields:
          - name: label
            label: 文档名称
            type: string
          - name: href
            label: 文件路径
            type: string
            description: PDF 放进 public/docs/ 后，这里填 /docs/文件名.pdf
      - name: order
        label: 排序
        type: number
        description: 数字越大越靠前。
      - name: draft
        label: 隐藏这个作品
        type: boolean
      - name: body
        label: 正文
        type: rich-text
        description: 建议按「背景 → 我做了什么 → 结果 → 一点反思」写。

  # ---------- 关于页自述 ----------
  - name: about
    label: 关于页 · 自述
    type: file
    path: src/content/about/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: 自述正文
        type: rich-text
